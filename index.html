    <h1>Курсы нейросетей во Владивостоке — школа «Хакни Нейросети»</h1>
    <p><strong>«Хакни Нейросети»</strong> — школа практического обучения искусственному интеллекту и нейросетям во Владивостоке. Мы учим предпринимателей, специалистов, фрилансеров и сотрудников компаний применять ИИ в маркетинге, дизайне, видео, создании сайтов, автоматизации и работе с ИИ-агентами.</p>

    <h2>Что такое «Хакни Нейросети»?</h2>
    <p>«Хакни Нейросети» — школа практического обучения искусственному интеллекту во Владивостоке, работающая с 2022 года. Обучение проходит очно, в живом классе, со спикером и кураторами-практиками.</p>

    <h2>Где проходит обучение?</h2>
    <p>Обучение проходит очно во Владивостоке по адресу: ул. Русская, 41а, 3 этаж. Время работы: пн–сб, 10:00–20:00.</p>

    <h2>Сколько длится курс?</h2>
    <p>Основной курс длится 3 месяца и включает 72 часа практического обучения: 24 модуля, занятия два раза в неделю по 3 часа. Записи занятий доступны 6 месяцев.</p>

    <h2>Кому подходит курс?</h2>
    <p>Курс подходит предпринимателям, специалистам, фрилансерам, маркетологам, дизайнерам и новичкам без технической подготовки. Опыт в программировании не требуется.</p>

    <h2>Чему обучают на курсе?</h2>
    <p>Студенты изучают работу с языковыми моделями (ChatGPT, Gemini, Perplexity), промпт-инжиниринг, генерацию изображений и видео, создание сайтов, контента, ИИ-агентов, маркетинговых воронок и автоматизацию бизнес-процессов.</p>

    <h2>Кто ведёт обучение?</h2>
    <p>Основатель школы — Сергей Черников, эксперт по искусственному интеллекту и практическому применению нейросетей. С 2018 года на его программах обучились более 10 000 человек.</p>

      <li>Поток 2 — старт 9 декабря 2026, четверг с 17:00 до 20:00 и суббота с 09:00 до 12:00.</li>
    </ul>

    <h2>Стоимость курса</h2>
    <p>Стоимость основного курса — от 150 000 ₽, доступна рассрочка от 12 500 ₽ в месяц и кредит на 3, 6 или 12 месяцев. Корпоративное обучение — от 200 000 ₽ за команду до 10 человек, индивидуальное обучение — от 300 000 ₽. Возможна оплата от юридического лица по договору.</p>

    <p>Школа проводит корпоративное обучение нейросетям для компаний Владивостока и Приморского края: программа собирается под задачи команды, с закрывающими документами и договором.</p>

<script>
(function(){
  function getParam(name){
    var m = new RegExp('[?&]'+name+'=([^&]+)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : null;
  }
  var keys = ['gcpc','gcao','utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
  keys.forEach(function(k){
    var v = getParam(k);
    if (v) localStorage.setItem('ref_' + k, v);
  });

  function buildQuery(){
    var parts = [];
    keys.forEach(function(k){
      var v = localStorage.getItem('ref_' + k);
      if (v) parts.push(k + '=' + encodeURIComponent(v));
    });
    return parts.join('&');
  }

  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href*="getcourse.ru"]');
    if (!a) return;
    var qs = buildQuery();
    if (!qs) return;
    var sep = a.href.indexOf('?') === -1 ? '?' : '&';
    a.href = a.href + sep + qs;
  }, true);
})();
</script>
